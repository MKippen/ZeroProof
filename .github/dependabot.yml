version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pnpm has one workspace lockfile at the repository root. Updating the
  # leaf manifests independently bypasses that shared resolution.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    ignore:
      # Match the Node 24 runtime used by CI and all Dockerfiles.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React and its types need a coordinated application migration.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
    groups:
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
      workspace-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      workspace-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # The privileged updater intentionally uses its own npm lockfile.
  - package-ecosystem: "npm"
    directory: "/updater"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ts-jest currently uses Jest 29 and TypeScript 5; migrate together.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      updater:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend", "/updater"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      runtime-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
