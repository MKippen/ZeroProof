version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pnpm has one workspace lockfile at the repository root. Updating the
  # leaf manifests independently bypasses that shared resolution.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      workspace-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      workspace-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # The privileged updater intentionally uses its own npm lockfile.
  - package-ecosystem: "npm"
    directory: "/updater"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      updater:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend", "/updater"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      runtime-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
