id: validated_compromise
description: |
  Corroborates a threat-intel flow match with a UniFi IDS event from the same
  source IP and immutable controller/site scope. Both underlying events must
  occur within the evaluation window. Reporting gateway MAC addresses and
  client display names are not used as endpoint identity.

  Investigate promptly. These signals establish suspicious network activity,
  not successful compromise; a blocked attempt may not have reached its target.
  Legacy telemetry without source provenance and DNS without an explicit
  network binding cannot produce this correlation.
severity:
  base: CRITICAL
remediation: |
  Follow the incident investigation playbook:
    1. Preserve the referenced flow, indicator, and IDS evidence.
    2. Verify which endpoint held the source IP at each event time, including
       DHCP changes, NAT, shared resolvers, and security-test activity.
    3. Check the signature, direction, action, and endpoint telemetry to
       establish whether the activity was malicious and whether it succeeded.
    4. Contain confirmed malicious activity according to the incident policy;
       assess recovery and credential rotation using the confirmed impact.
    5. Document the timeline, disposition, and any tuning needed.
references:
  - https://attack.mitre.org/
retention_days: 90
